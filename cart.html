<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PERSONA - Cart</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=Cormorant+Garamond:wght@300;400;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="shop.css" />
</head>
<body>
  <div id="cursor-dot"></div>
  <div id="cursor-ring"></div>

  <nav class="lux-nav">
    <a class="crown-logo" href="index.html" aria-label="Persona home"><span></span><span></span><span></span></a>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="index.html#about">About</a></li>
      <li><a href="shop.html">Collection</a></li>
      <li><a href="checkout.html">Checkout</a></li>
    </ul>
    <a class="cart-nav" href="cart.html">Cart (<span id="cartCount">0</span>)</a>
  </nav>

  <header class="page-header compact-header">
    <h1>Your <em>Cart.</em></h1>
    <div class="page-header-meta">
      <p>Edit quantity · Remove items</p>
      <span id="cartHeaderTotal">Rs. 0</span>
      <p style="margin-top:4px">Free shipping above Rs. 1499</p>
    </div>
  </header>

  <main class="cart-shell">
    <section class="cart-list" id="cartItems"></section>

    <aside class="cart-summary">
      <p class="summary-label">Order Summary</p>
      <div class="summary-row"><span>Items</span><span id="summaryItems">0</span></div>
      <div class="summary-row"><span>Subtotal</span><span id="summarySubtotal">₹0</span></div>
      <div class="summary-row"><span>Shipping</span><span id="summaryShipping">Testing only</span></div>
      <div class="summary-total"><span>Total</span><span id="summaryTotal">₹0</span></div>
      <a class="summary-btn" id="checkoutLink" href="checkout.html">Proceed to Checkout</a>
      <a class="summary-link" href="shop.html">Continue Shopping</a>
    </aside>
  </main>

  <div class="cart-toast" id="cartToast">Cart updated ✦</div>

  <footer class="shop-footer">
    <p>© 2025 Persona.</p>
    <p><a href="shop.html">Back to Shop</a></p>
  </footer>

  <script src="cart.js"></script>
</body>
</html>
