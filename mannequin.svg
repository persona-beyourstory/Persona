<?xml version="1.0" encoding="UTF-8"?>
<svg id="mannequin-svg" viewBox="0 0 280 480" fill="none" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="bodyShade" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0%" stop-color="rgba(0,0,0,0.35)"/>
              <stop offset="45%" stop-color="rgba(255,255,255,0.04)"/>
              <stop offset="100%" stop-color="rgba(0,0,0,0.28)"/>
            </linearGradient>
            <linearGradient id="skinGrad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#2a1a0e"/>
              <stop offset="100%" stop-color="#1a0e06"/>
            </linearGradient>
            <filter id="glow2">
              <feGaussianBlur stdDeviation="2.5" result="b"/>
              <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
            </filter>
          </defs>

          <!-- Stand -->
          <ellipse cx="140" cy="470" rx="56" ry="8" fill="rgba(201,168,76,.12)" stroke="rgba(201,168,76,.25)" stroke-width="1"/>
          <rect x="133" y="405" width="14" height="68" rx="5" fill="rgba(201,168,76,.15)" stroke="rgba(201,168,76,.25)" stroke-width="1"/>
          <line x1="88" y1="468" x2="192" y2="468" stroke="rgba(201,168,76,.25)" stroke-width="2"/>

          <!-- Hips -->
          <path d="M96 320 Q89 360 91 400 L189 400 Q191 360 184 320 Z" fill="rgba(201,168,76,.05)" stroke="rgba(201,168,76,.18)" stroke-width="1"/>

          <!-- SHIRT body -->
          <path id="shirt-body"
            d="M72 132 L32 162 L54 198 L76 180 L76 318 L204 318 L204 180 L226 198 L248 162 L208 132 L184 147 Q140 168 96 147 Z"
            fill="#1a1a1a" stroke="rgba(201,168,76,.32)" stroke-width="1.5"/>
          <!-- Shade overlay -->
          <path d="M72 132 L32 162 L54 198 L76 180 L76 318 L204 318 L204 180 L226 198 L248 162 L208 132 L184 147 Q140 168 96 147 Z"
            fill="url(#bodyShade)" opacity=".65"/>

          <!-- Shirt seam -->
          <line x1="140" y1="168" x2="140" y2="316" stroke="rgba(201,168,76,.1)" stroke-width="1" stroke-dasharray="4,7"/>
          <path d="M76 210 Q140 228 204 210" stroke="rgba(201,168,76,.08)" stroke-width="1" fill="none"/>

          <!-- PERSONA print design -->
          <g id="shirt-design" filter="url(#glow2)">
            <polygon points="140,198 157,220 140,242 123,220" stroke="rgba(201,168,76,.85)" stroke-width="1.2" fill="rgba(201,168,76,.07)"/>
            <polygon points="140,208 150,220 140,232 130,220" fill="rgba(201,168,76,.28)"/>
            <line x1="112" y1="252" x2="168" y2="252" stroke="rgba(201,168,76,.28)" stroke-width=".8"/>
            <text x="140" y="264" text-anchor="middle" font-family="serif" font-size="11" font-style="italic" fill="rgba(201,168,76,.9)" letter-spacing="3">PERSONA</text>
            <text x="140" y="278" text-anchor="middle" font-family="monospace" font-size="5.5" fill="rgba(201,168,76,.38)" letter-spacing="4.5">BE YOUR STORY</text>
          </g>

          <!-- Collar -->
          <path d="M112 147 Q140 162 168 147 Q155 135 140 132 Q125 135 112 147 Z"
            fill="#0d0d0d" stroke="rgba(201,168,76,.4)" stroke-width="1.2"/>
          <!-- Shoulder seams -->
          <path d="M72 132 Q56 126 49 140 L76 160 Q81 150 96 147 Z" fill="#1a1a1a" stroke="rgba(201,168,76,.18)" stroke-width="1"/>
          <path d="M208 132 Q224 126 231 140 L204 160 Q199 150 184 147 Z" fill="#1a1a1a" stroke="rgba(201,168,76,.18)" stroke-width="1"/>

          <!-- Neck -->
          <rect x="129" y="92" width="22" height="46" rx="9" fill="url(#skinGrad)" stroke="rgba(201,168,76,.18)" stroke-width="1"/>

          <!-- Head -->
          <ellipse cx="140" cy="70" rx="34" ry="41" fill="url(#skinGrad)" stroke="rgba(201,168,76,.22)" stroke-width="1.5"/>
          <ellipse cx="133" cy="60" rx="9" ry="13" fill="rgba(255,255,255,0.035)"/>
          <!-- Eyes -->
          <ellipse cx="127" cy="62" rx="4.5" ry="5.5" fill="#060402" stroke="rgba(201,168,76,.5)" stroke-width="1"/>
          <ellipse cx="153" cy="62" rx="4.5" ry="5.5" fill="#060402" stroke="rgba(201,168,76,.5)" stroke-width="1"/>
          <circle cx="127" cy="63" r="2.2" fill="rgba(201,168,76,.85)"/>
          <circle cx="153" cy="63" r="2.2" fill="rgba(201,168,76,.85)"/>
          <circle cx="128.2" cy="61.8" r=".7" fill="rgba(255,255,255,.5)"/>
          <circle cx="154.2" cy="61.8" r=".7" fill="rgba(255,255,255,.5)"/>
          <!-- Eyebrows -->
          <path d="M121 55 Q127 52 133 55" stroke="rgba(201,168,76,.65)" stroke-width="1.5" fill="none" stroke-linecap="round"/>
          <path d="M147 55 Q153 52 159 55" stroke="rgba(201,168,76,.65)" stroke-width="1.5" fill="none" stroke-linecap="round"/>
          <!-- Nose -->
          <path d="M137 68 Q140 75 143 68" stroke="rgba(201,168,76,.28)" stroke-width="1" fill="none"/>
          <!-- Lips -->
          <path d="M131 79 Q140 85 149 79" stroke="rgba(201,168,76,.45)" stroke-width="1.3" fill="none" stroke-linecap="round"/>
          <path d="M133 79 Q140 77 147 79" stroke="rgba(201,168,76,.2)" stroke-width=".8" fill="none"/>
          <!-- Hair -->
          <path d="M107 56 Q110 18 140 16 Q170 18 173 56 Q163 36 140 34 Q117 36 107 56 Z"
            fill="#060402" stroke="rgba(201,168,76,.12)" stroke-width="1"/>
          <!-- Ears -->
          <ellipse cx="107" cy="70" rx="6" ry="9" fill="url(#skinGrad)" stroke="rgba(201,168,76,.18)" stroke-width="1"/>
          <ellipse cx="173" cy="70" rx="6" ry="9" fill="url(#skinGrad)" stroke="rgba(201,168,76,.18)" stroke-width="1"/>

          <!-- Arms -->
          <path d="M76 180 L56 285 Q53 300 60 306 L74 308 Q78 302 80 288 L90 198 Z"
            fill="#1a1a1a" stroke="rgba(201,168,76,.18)" stroke-width="1"/>
          <ellipse cx="65" cy="314" rx="12" ry="9" fill="url(#skinGrad)" stroke="rgba(201,168,76,.18)" stroke-width="1"/>
          <path d="M204 180 L224 285 Q227 300 220 306 L206 308 Q202 302 200 288 L190 198 Z"
            fill="#1a1a1a" stroke="rgba(201,168,76,.18)" stroke-width="1"/>
          <ellipse cx="215" cy="314" rx="12" ry="9" fill="url(#skinGrad)" stroke="rgba(201,168,76,.18)" stroke-width="1"/>

          <!-- Legs -->
          <path d="M96 318 L89 400 L119 400 L131 348 L149 348 L161 400 L191 400 L184 318 Z"
            fill="#100d00" stroke="rgba(201,168,76,.16)" stroke-width="1"/>
          <line x1="114" y1="328" x2="106" y2="396" stroke="rgba(201,168,76,.08)" stroke-width="1"/>
          <line x1="166" y1="328" x2="174" y2="396" stroke="rgba(201,168,76,.08)" stroke-width="1"/>

          <!-- Shoes -->
          <ellipse cx="104" cy="402" rx="18" ry="7" fill="#080600" stroke="rgba(201,168,76,.22)" stroke-width="1"/>
          <ellipse cx="176" cy="402" rx="18" ry="7" fill="#080600" stroke="rgba(201,168,76,.22)" stroke-width="1"/>
          <path d="M88 402 Q104 396 120 402" stroke="rgba(201,168,76,.38)" stroke-width="1" fill="none"/>
          <path d="M160 402 Q176 396 192 402" stroke="rgba(201,168,76,.38)" stroke-width="1" fill="none"/>
        </svg>
