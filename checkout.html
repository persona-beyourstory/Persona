<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PERSONA - Checkout</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Cormorant+Garamond:wght@300;400;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="shop.css" />
  <link rel="stylesheet" href="persona-upgrade.css" />
  <link rel="stylesheet" href="persona-bot.css" />
</head>
<body>
  <div id="cursor-dot"></div>
  <div id="cursor-ring"></div>

  <nav class="lux-nav">
    <a class="crown-logo" href="index.html" aria-label="Persona home"><span></span><span></span><span></span></a>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="index.html#craft">Craft</a></li>
      <li><a href="shop.html">Collection</a></li>
      <li><a href="checkout.html" style="color:var(--gold)">Checkout</a></li>
    </ul>
    <a class="cart-nav" href="cart.html">Cart (<span id="cartCount">0</span>)</a>
  </nav>

  <header class="page-header compact-header">
    <h1>Check<em>out.</em></h1>
    <div class="page-header-meta">
      <p>Order request</p>
      <span id="checkoutHeaderTotal">Rs. 0</span>
      <p style="margin-top:4px">We will contact you soon about payment</p>
    </div>
  </header>

  <main class="checkout-shell">
    <form class="checkout-form glow-card" id="checkoutForm">
      <p class="summary-label">Customer Details</p>
      <div class="form-grid">
        <label>
          Full Name
          <input name="name" type="text" autocomplete="name" required />
        </label>
        <label>
          Email ID
          <input name="email" type="email" autocomplete="email" required />
        </label>
        <label>
          Phone Number
          <input name="phone" type="tel" autocomplete="tel" required />
        </label>
        <label>
          City
          <input name="city" type="text" autocomplete="address-level2" required />
        </label>
        <label class="span-2">
          Full Address
          <textarea name="address" rows="4" autocomplete="street-address" required></textarea>
        </label>
        <label>
          State
          <input name="state" type="text" autocomplete="address-level1" required />
        </label>
        <label>
          PIN Code
          <input name="pincode" type="text" autocomplete="postal-code" required />
        </label>
        <label class="span-2">
          Notes
          <textarea name="notes" rows="3" placeholder="Optional"></textarea>
        </label>
      </div>
      <button class="summary-btn checkout-submit" type="submit">Send Order Request</button>
      <p class="checkout-status" id="checkoutStatus"></p>
    </form>

    <aside class="checkout-summary glow-card">
      <p class="summary-label">Purchased Items</p>
      <div id="checkoutItems"></div>
      <div class="summary-row"><span>Items</span><span id="checkoutItemsCount">0</span></div>
      <div class="summary-row"><span>Subtotal</span><span id="checkoutSubtotal">Rs. 0</span></div>
      <div class="summary-total"><span>Total</span><span id="checkoutTotal">Rs. 0</span></div>
      <a class="summary-link" href="cart.html">Edit Cart</a>
    </aside>
  </main>

  <footer class="shop-footer">
    <p>&copy; 2025 Persona.</p>
    <p><a href="cart.html">Back to Cart</a></p>
  </footer>

  <script src="config.js"></script>
  <script src="checkout.js"></script>
  <script src="site-effects.js"></script>
  <script src="persona-bot.js"></script>
</body>
</html>
